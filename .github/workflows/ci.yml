name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the Tuist version pinned in mise.toml, keeping CI and local dev
      # in sync. Not Homebrew: the tuist tap's cask declares `conflicts_with
      # formula:`, a key Homebrew 6 dropped, which aborts any `tuist` lookup in
      # the tap. See tuist/homebrew-tuist#41.
      - name: Install Tuist
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Lint
        run: swift run --package-path BuildTools swiftformat . --lint

      - name: Fetch Dependencies
        run: tuist install

      - name: Generate Project
        run: tuist generate --no-open

      - name: Build
        run: |
          xcodebuild build \
            -workspace Allkdic.xcworkspace \
            -scheme Allkdic \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -workspace Allkdic.xcworkspace \
            -scheme Allkdic \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
